<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
    <div class="upper-section">
        <div class="img-box">
            <img src="https://img.freepik.com/premium-photo/cartoon-portrait-bald-man-with-glasses-beard-generative-ai_974533-29580.jpg?ga=GA1.1.1971851003.1734379144&semt=ais_hybrid">
        </div>
    </div>
    <div class="lower-section">
        <div class="user">
            <h1>Natthy Junior</h1>
            <p class="username">@natthy_junior</p>
            <div class="social-link">
                <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank"><i class="fab fa-telegram"></i></a>
            </div>
        </div>
        <div class="lower-content">
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip.</p>
        </div>
        <div class="btn-wrapper">
            <button>Follow</button>
            <button>Message</button>
        </div>
    </div>
</div>

</body>
</html>
