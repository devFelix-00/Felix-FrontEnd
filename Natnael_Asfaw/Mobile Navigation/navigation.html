<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Navigation</title>
    <link rel="stylesheet" href="navigation.css">
  </head>
  <body>
    <div class="outer-wrapper">
      <div class="internal-wrapper">
        <div class="header">
          <div class="img-wrapper">
            <img src="images/home/jelani nelson.png" alt="me" />
          </div>
          <div class="title-wrapper">
            <h2>Jelani Nelson</h2>
            <p>CEO and Founder of Addis Coders</p>
          </div>
        </div>
        <hr />
        <div class="main-content">
          <div class="nav-lists-wrapper">
            <div class="nav-item1">
              <div class="inner-item1">
                <span><img src="Images/icons/user_icon.svg" alt="" /></span>
                <p>Personal Data</p>
              </div>
              
              <div class="inner-item2"><span><img src="Images/icons/arrow_icon.svg"></span></div>
            </div>
            <div class="nav-item2">
              <div class="inner-item1">
                <span
                  ><img src="images/icons/message_icon.svg" alt="message icon"
                /></span>
                <p>Messages</p>
              </div>
              
              <div class="inner-item2"><span><img src="Images/icons/arrow_icon.svg"></span></div>
            </div>
            <div class="nav-item3">
              <div class="inner-item1">
                <span
                  ><img
                    src="Images/icons/notification_icon.svg"
                    alt="notification"
                /></span>
                <p>Notifications</p>
              </div>
              
              <div class="inner-item2"><span><img src="Images/icons/arrow_icon.svg"></span></div>
            </div>
            <div class="nav-item4">
              <div class="inner-item1">
                <span
                  ><img
                    src="Images/icons/location_icon.svg"
                    alt="location icon"
                /></span>
                <p>Location</p>
              </div>
              
              <div class="inner-item2"><span><img src="Images/icons/arrow_icon.svg"></span></div>
            </div>
            <div class="nav-item5">
              <div class="inner-item1">
                <span
                  ><img
                    src="Images/icons/community_icon.svg"
                    alt="community icon"
                /></span>
                <p>Community</p>
              </div>
              
              <div class="inner-item2"><span><img src="Images/icons/arrow_icon.svg"></span></div>
            </div>
          </div>
          <hr />
          <div class="lw-nav-lists-wrapper">
            <div class="nav-item6">
              <div class="inner-item1">
                <span
                  ><img src="Images/icons/user_icon.svg" alt="FAQs icon"
                /></span>
                <p>FAQs</p>
              </div>
              
              <div class="inner-item2"><span><img src="Images/icons/arrow_icon.svg"></span></div>
            </div>
            <div class="nav-item7">
              <div class="inner-item1">
                <span
                  ><img
                    src="Images/icons/settings_icon.svg"
                    alt="settings icon"
                /></span>
                <p>Settings</p>
              </div>
              
              <div class="inner-item2"><span><img src="Images/icons/arrow_icon.svg"></span></div>
            </div>
          </div>
        </div>
        <div class="footer">
          <div class="item-1"><img src="Images/icons/inbox.svg" alt=""></div>
          <div class="item-2"><img src="Images/icons/stats.svg" alt=""></div>
          <div class="item-3"><img src="Images/icons/ibox-icon.svg" alt=""></div>
          <div class="item-4"><img src="Images/icons/man 2.svg" alt=""></div>
        </div>
      </div>
    </div>
  </body>
</html>
